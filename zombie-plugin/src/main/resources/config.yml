config-version: 1

plugin:
  language: fr_FR
  debug: false
  check-for-updates: false

server:
  lobby-world: zombie_lobby
  fallback-world: world

lobby:
  world: zombie_lobby
  spawn:
    world: zombie_lobby
    x: 0.5
    y: 65.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

storage:
  type: sqlite
  sqlite-file: data.db

instances:
  worlds-directory: zombie_instances
  templates-directory: zombie_templates
  delete-world-after-game: true
  preserve-failed-worlds: true
  unload-delay-seconds: 5
  creation-timeout-seconds: 60
  maximum-concurrent-games: -1
  prevent-entry-without-session: true
  default-map-maximum-players: 4

chat:
  isolation-enabled: true
  lobby-channel-enabled: true
  instance-channel-enabled: true
  allow-global-admin-channel: true

reconnect:
  enabled: true
  grace-period-seconds: 180
  reserve-player-slot: true
  return-to-lobby-after-expiration: true

world-rules:
  allow-natural-mob-spawning: false
  allow-weather-cycle: false
  allow-time-cycle: false
  allow-block-breaking: false
  allow-block-placing: false
  allow-item-dropping: false
  allow-item-pickup: true
  allow-pvp: false
  keep-inventory: true
  void-rescue-enabled: true

gui:
  default-theme: dark
  sounds-enabled: true
  animations-enabled: true
  session-timeout-seconds: 300
  input-timeout-seconds: 60
  confirmation-delay-ticks: 20
  refresh:
    maps-menu-ticks: 100
    instances-menu-ticks: 20
    diagnostics-menu-ticks: 40

game:
  minimum-players: 1
  countdown-seconds: 15
  cancel-countdown-if-not-enough-players: true
  join-in-progress: false
  end-screen-duration-seconds: 8

players:
  starting-points: 500
  points-per-kill: 100
  downed-system:
    enabled: true
    bleed-out-seconds: 30
    revive-duration-seconds: 5
    revive-health: 8.0

rounds:
  maximum-round: -1
  first-round-delay-seconds: 3
  transition:
    duration-seconds: 8
  enemy-count:
    base: 6
    per-round: 2
    player-multiplier: 0.75
    minimum: 1
    maximum-per-round: -1
  zombie-health:
    base-health: 20.0
    exponential-multiplier: 1.10
    maximum-health: -1
  spawning:
    maximum-alive:
      base: 24
      per-player: 6
    initial-delay-ticks: 40
    spawn-delay-ticks: 20
    minimum-spawn-delay-ticks: 5
    batch-size: 1

documentation:
  require-context-update: true
