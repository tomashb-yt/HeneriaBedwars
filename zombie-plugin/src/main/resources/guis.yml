      settings: {slot: 21, material: COMPARATOR, name: "<dark_gray>Configuration", lore: ["<gray>Configuration globale sécurisée."], permission: zombies.admin.config.view, actions: {left: feedback.unavailable}}
      diagnostics: {slot: 22, material: REDSTONE_TORCH, name: "<blue>Diagnostics", lore: ["<gray>État technique sans donnée sensible."], permission: zombies.admin.diagnostics, actions: {left: nav.diagnostics}}
      documentation: {slot: 23, material: WRITABLE_BOOK, name: "<blue>Documentation et journaux", lore: ["<gray>Consultez les diagnostics et les fichiers docs."], permission: zombies.admin.diagnostics, actions: {left: nav.diagnostics}}
      reload: {slot: 49, material: LIME_DYE, name: "<green>Recharger les GUI", lore: ["<gray>Activation atomique si la configuration est valide."], permission: zombie.command.reload, actions: {left: config.reload}}
      player: {slot: 53, material: PLAYER_HEAD, name: "<aqua>Menu joueur", lore: ["<gray>Voir l'expérience publique."], actions: {left: nav.player}}

  player-maps:
    title: "<dark_gray>Choisir une map"
    size: 54
    theme: dark
    content-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
