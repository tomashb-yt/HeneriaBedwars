command:
  information: |-
    <dark_gray>━━━━━━━━ <red><bold>HeneriaZombie</bold></red> <dark_gray>━━━━━━━━</dark_gray>
    <gray>Version : <white><version></white>
    <gray>État : <white><state></white>
    <gray>Maps enregistrées : <white><maps></white>
    <gray>Instances actives : <white><instances></white>
    <gray>Aide : <white>/zombie help</white>
  help: |-
    <red><bold>HeneriaZombie</bold></red> <gray>— Commandes</gray>
    <white>/zombie lobby</white> <dark_gray>:</dark_gray> <gray>retourne au lobby</gray>
    <white>/zombie map list</white> <dark_gray>:</dark_gray> <gray>détecte les maps déposées</gray>
    <white>/zombie map preview <map></white> <dark_gray>:</dark_gray> <gray>ouvre une copie de visite</gray>
    <white>/zombie map leave</white> <dark_gray>:</dark_gray> <gray>quitte la visite et nettoie sa copie</gray>
    <white>/zombie instance join <id></white> <dark_gray>:</dark_gray> <gray>rejoint une instance</gray>
    <white>/zombie instance leave</white> <dark_gray>:</dark_gray> <gray>quitte une instance</gray>
    <white>/zombie instance create <map></white> <dark_gray>:</dark_gray> <gray>crée une instance</gray>
    <white>/zombie instance list</white> <dark_gray>:</dark_gray> <gray>liste les instances</gray>
    <white>/zombie instance info <id></white> <dark_gray>:</dark_gray> <gray>inspecte une instance</gray>
    <white>/zombie instance stop <id></white> <dark_gray>:</dark_gray> <gray>arrête une instance</gray>
    <white>/zombie reload</white> <dark_gray>:</dark_gray> <gray>recharge les options sûres</gray>
  usage: '<red>Usage : /zombie [help|lobby|reload|map <list|preview|leave>|instance <create|list|join|leave|stop|info>]</red>'
