schema-version: 3
default-theme: dark

themes:
  dark:
    background:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    colors:
      primary: AQUA
      success: GREEN
      warning: GOLD
      danger: RED
      disabled: DARK_GRAY

menus:
  player-main:
    title: "<dark_gray>Heneria Zombies"
    size: 54
    theme: dark
    buttons:
      play: {slot: 20, material: NETHER_STAR, name: "<green>Jouer", lore: ["<gray>Choisir une map publiée.", "", "<yellow>Cliquez pour continuer."], permission: zombies.menu.player, sound: UI_BUTTON_CLICK, actions: {left: maps.player}}
      leave: {slot: 24, material: RED_BED, name: "<red>Quitter la partie", lore: ["<gray>Retourner immédiatement au lobby."], permission: zombies.menu.player, actions: {left: maps.leave}}
      statistics: {slot: 31, material: BOOK, name: "<dark_gray>Statistiques — indisponible", lore: ["<gray>Prévu dans un prochain ticket."], actions: {left: feedback.unavailable}}
      settings: {slot: 33, material: COMPARATOR, name: "<dark_gray>Paramètres — indisponible", lore: ["<gray>Prévu dans un prochain ticket."], actions: {left: feedback.unavailable}}
      help: {slot: 49, material: PAPER, name: "<blue>Aide", lore: ["<gray>Utilisez /zombie help."], actions: {left: feedback.unavailable}}
      admin: {slot: 53, material: COMMAND_BLOCK, name: "<red>Administration", lore: ["<gray>Ouvrir l'espace administrateur."], permission: zombies.menu.admin, actions: {left: nav.admin}}

  admin-main:
    title: "<dark_gray>Administration Zombies"
    size: 54
    theme: dark
    buttons:
      maps: {slot: 10, material: FILLED_MAP, name: "<aqua>Gestion des maps", lore: ["<gray>Créer, valider, tester et publier.", "", "<yellow>Cliquez pour ouvrir."], permission: zombies.admin.maps.view, sound: UI_BUTTON_CLICK, actions: {left: maps.admin}}
      instances: {slot: 11, material: ENDER_EYE, name: "<light_purple>Parties et instances", lore: ["<gray>Inspecter, rejoindre ou arrêter."], permission: zombies.admin.games.view, actions: {left: nav.instances}}
      weapons: {slot: 12, material: CROSSBOW, name: "<gold>Armes", lore: ["<gray>Catalogue et statistiques."], permission: zombies.admin.weapon.types, actions: {left: nav.weapons}}
      zombies: {slot: 13, material: ZOMBIE_HEAD, name: "<green>Zombies", lore: ["<gray>Types et moteur d'ennemis.", "<dark_gray>Commandes avancées conservées."], permission: zombies.admin.zombie.types, actions: {left: feedback.unavailable}}
      economy: {slot: 14, material: GOLD_INGOT, name: "<yellow>Économie", lore: ["<gray>Points et transactions.", "<dark_gray>Commandes avancées conservées."], permission: zombies.admin.economy.balance, actions: {left: feedback.unavailable}}
      powerups: {slot: 15, material: NETHER_STAR, name: "<light_purple>Power-ups", lore: ["<gray>Bonus actifs et configuration."], permission: zombies.admin.economy.powerup, actions: {left: feedback.unavailable}}
