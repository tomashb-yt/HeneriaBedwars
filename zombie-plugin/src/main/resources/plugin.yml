name: HeneriaZombie
version: '${version}'
main: fr.heneria.zombie.plugin.HeneriaZombiePlugin
description: Modular Zombies minigame foundation for Heneria
api-version: '1.21'
authors:
  - Heneria
website: https://github.com/tomashb-yt/HeneriaBedwars

commands:
  zombie:
    description: Manages the HeneriaZombie lobby and isolated instances
    usage: /zombie [help|lobby|admin|reload|map|instance]
    permission: zombie.command.use
  zombies:
    description: Opens the HeneriaZombie player menu
    usage: /zombies
    permission: zombie.gui.player
  zmap:
    description: Creates and edits versioned Zombies maps in game
    usage: /zmap [create|edit|leave|validate|test|save|undo|redo]
    permission: zombie.editor
  zgame:
    description: Administers active Zombies games and rounds
    usage: /zgame [list|info|start|stop|nextround|setround|debug]
    permission: zombies.admin.game.list
  zzombie:
    description: Inspects and administers the HeneriaZombie enemy engine
    usage: /zzombie [list|types|info|spawn|kill|removeall|debug|reload]
    permission: zombies.admin.zombie.list
  zweapon:
    description: Inspects and administers the HeneriaZombie weapon engine
    usage: /zweapon [types|info|give|reload|stats|gui]
    permission: zombies.admin.weapon.types

permissions:
  zombie.admin:
    description: Grants every HeneriaZombie administrative permission
    default: op
    children:
      zombie.command.use: true
      zombie.command.reload: true
      zombie.instance.admin: true
      zombie.chat.global: true
      zombie.world.bypass: true
      zombie.editor: true
      zombie.play: true
      zombie.gui.player: true
      zombie.gui.admin: true
      zombie.gui.maps: true
      zombie.gui.instances: true
      zombie.gui.settings: true
      zombie.gui.diagnostics: true
      zombie.gui.dangerous-actions: true
      zombies.admin.game.start: true
      zombies.admin.game.stop: true
      zombies.admin.game.round: true
      zombies.admin.game.list: true
      zombies.admin.game.debug: true
      zombies.admin.zombie.list: true
      zombies.admin.zombie.types: true
      zombies.admin.zombie.info: true
      zombies.admin.zombie.spawn: true
      zombies.admin.zombie.kill: true
      zombies.admin.zombie.remove: true
      zombies.admin.zombie.debug: true
      zombies.admin.zombie.reload: true
      zombies.admin.weapon.types: true
      zombies.admin.weapon.info: true
      zombies.admin.weapon.give: true
      zombies.admin.weapon.reload: true
      zombies.admin.weapon.stats: true
  zombie.command.use:
    description: Allows use of the base /zombie command
    default: true
  zombie.command.reload:
    description: Allows safe configuration and message reload
    default: op
  zombie.instance.admin:
    description: Allows instance creation, inspection, listing and shutdown
    default: op
  zombie.chat.global:
    description: Allows the explicit ! administrative global chat channel
    default: op
  zombie.world.bypass:
    description: Bypasses runtime-world interaction protections
    default: op
  zombie.editor:
    description: Allows use of the universal map editor
    default: op
  zombie.play:
    description: Allows lobby and instance player commands
    default: true
  zombie.gui.player:
    description: Opens player-facing GUI screens
    default: true
  zombie.gui.admin:
    description: Opens the administrative GUI
    default: op
  zombie.gui.maps:
    description: Displays and operates the map selector
    default: op
  zombie.gui.instances:
    description: Displays and operates instance management
    default: op
  zombie.gui.settings:
    description: Reserves access to future global GUI settings
    default: op
  zombie.gui.diagnostics:
    description: Displays non-sensitive runtime diagnostics
    default: op
  zombie.gui.dangerous-actions:
    description: Confirms destructive GUI actions
    default: op
  zombies.admin.game.start:
    description: Starts a game in an existing instance
    default: op
  zombies.admin.game.stop:
    description: Stops an active game
    default: op
  zombies.admin.game.round:
    description: Changes the current game round
    default: op
  zombies.admin.game.list:
    description: Lists and inspects active games
    default: op
  zombies.admin.game.debug:
    description: Shows detailed game diagnostics
    default: op
  zombies.admin.zombie.list:
    description: Lists active engine zombies
    default: op
  zombies.admin.zombie.types:
    description: Lists loaded zombie definitions
    default: op
  zombies.admin.zombie.info:
    description: Inspects a registered zombie
    default: op
  zombies.admin.zombie.spawn:
    description: Spawns a configured zombie for diagnostics
    default: op
  zombies.admin.zombie.kill:
    description: Kills a registered zombie through the damage service
    default: op
  zombies.admin.zombie.remove:
    description: Removes all zombies of a game without rewards
    default: op
  zombies.admin.zombie.debug:
    description: Displays detailed runtime enemy diagnostics
    default: op
  zombies.admin.zombie.reload:
    description: Atomically reloads future-spawn zombie definitions
    default: op
  zombies.admin.weapon.types:
    description: Lists configured weapons and opens the weapon GUI
    default: op
  zombies.admin.weapon.info:
    description: Inspects one configured weapon
    default: op
  zombies.admin.weapon.give:
    description: Gives a weapon to a player in an active game
    default: op
  zombies.admin.weapon.reload:
    description: Atomically reloads weapon definitions
    default: op
  zombies.admin.weapon.stats:
    description: Displays current per-weapon statistics
    default: op
